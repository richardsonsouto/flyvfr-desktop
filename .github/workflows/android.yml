name: App Android

on:
  push:
    branches: [main, android-app]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências e copiar as telas para o projeto Android
        run: |
          npm ci
          npx cap sync android

      - name: Chave de assinatura (segredos do repositório)
        env:
          KEYSTORE_BASE64: ${{ secrets.VFR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vfr.keystore"
            echo "VFR_KEYSTORE_FILE=$RUNNER_TEMP/vfr.keystore" >> "$GITHUB_ENV"
            echo "Assinando com a chave da Play Store."
          else
            echo "::warning::Sem o segredo VFR_KEYSTORE_BASE64: o APK de teste é gerado, mas o .aab da Play Store sai sem assinatura."
          fi

      - name: Compilar APK e AAB
        working-directory: android-app/android
        env:
          VFR_KEYSTORE_PASSWORD: ${{ secrets.VFR_KEYSTORE_PASSWORD }}
          VFR_KEY_ALIAS: ${{ secrets.VFR_KEY_ALIAS }}
          VFR_KEY_PASSWORD: ${{ secrets.VFR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease -PvfrVersionCode=$CODE -PvfrVersionName=2.0.$GITHUB_RUN_NUMBER
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/VirtualFlightReport-teste.apk
          cp app/build/outputs/apk/release/*.apk ../../dist/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab ../../dist/VirtualFlightReport-playstore.aab
          ls -la ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualFlightReport-android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Publicar o APK para download (release android-apk)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-apk >/dev/null 2>&1 || gh release create android-apk --prerelease --title "Android - APK mais recente" --notes "APK gerado automaticamente a cada versão do app. Para a Play Store, use o .aab dos artefatos do GitHub Actions." --target "$GITHUB_SHA"
          gh release upload android-apk dist/*.apk --clobber
