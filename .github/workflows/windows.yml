name: App Windows

on:
  push:
    branches: [main, android-app]
    paths: ["desktop-app/**", "android-app/www/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o instalador (telas da pasta android-app/www)
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualFlightReport-windows-${{ github.run_number }}
          path: |
            desktop-app/dist/*.exe
            desktop-app/dist/*.blockmap
            desktop-app/dist/latest.yml
          if-no-files-found: error
