name: App Windows

on:
  push:
    branches: [main, android-app]
    tags: ["v*"]
    paths: ["desktop-app/**", "android-app/www/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o instalador (telas da pasta android-app/www)
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualFlightReport-windows-${{ github.run_number }}
          path: |
            desktop-app/dist/*.exe
            desktop-app/dist/*.blockmap
            desktop-app/dist/latest.yml
          if-no-files-found: error

      - name: Publicar a versão (tag vX.Y.Z) para a atualização automática
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$V" || { echo "::error::package.json não está na versão $V"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/VirtualFlightReport-Desktop-Setup-$V.exe dist/VirtualFlightReport-Desktop-Setup-$V.exe.blockmap dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --title "Virtual Flight Report $V" --notes "Telas do app atualizadas: cores da companhia escolhida para voar, cartões de embarque e linha do tempo na Escala, menu Análise de reportes, foto real da aeronave, regra de posição da frota e Manual atualizado nos 8 idiomas." --latest
