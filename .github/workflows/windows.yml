name: App Windows

on:
  push:
    branches: [main, android-app]
    tags: ["v*"]
    paths: ["desktop-app/**", "android-app/www/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o instalador (telas da pasta android-app/www)
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualFlightReport-windows-${{ github.run_number }}
          path: |
            desktop-app/dist/*.exe
            desktop-app/dist/*.blockmap
            desktop-app/dist/latest.yml
          if-no-files-found: error

      - name: Publicar a versão nova (quando o package.json traz uma versão ainda não publicada)
        if: github.ref == 'refs/heads/android-app' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$V já publicada: nada a fazer."; exit 0; fi
          gh release create "v$V" dist/VirtualFlightReport-Desktop-Setup-$V.exe dist/VirtualFlightReport-Desktop-Setup-$V.exe.blockmap dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Virtual Flight Report $V" --latest \
            --notes "Telas do app atualizadas: cores da companhia escolhida para voar, cartões de embarque e linha do tempo na Escala, menu Análise de reportes, foto real da aeronave, regra de posição da frota e Manual atualizado nos 8 idiomas."
